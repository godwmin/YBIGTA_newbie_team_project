name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./YBIGTA_newbie_team_project
          file: ./YBIGTA_newbie_team_project/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_REPOSITORY }}:latest
            ${{ secrets.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
        shell: bash
        run: |
          set -euo pipefail

          required=(
            EC2_HOST
            EC2_USERNAME
            EC2_SSH_KEY
            MYSQL_USER
            MYSQL_PASSWORD
            MYSQL_HOST
            MYSQL_PORT
            MYSQL_DATABASE
            MONGO_URL
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Secret is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Create runtime environment file
        env:
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'MYSQL_USER=%s\n' "$MYSQL_USER"
            printf 'MYSQL_PASSWORD=%s\n' "$MYSQL_PASSWORD"
            printf 'MYSQL_HOST=%s\n' "$MYSQL_HOST"
            printf 'MYSQL_PORT=%s\n' "$MYSQL_PORT"
            printf 'MYSQL_DATABASE=%s\n' "$MYSQL_DATABASE"
            printf 'MONGO_URL=%s\n' "$MONGO_URL"
          } > "$RUNNER_TEMP/app.env"

      - name: Copy environment file to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ec2_key" "$EC2_USERNAME@$EC2_HOST" \
            'mkdir -p "$HOME/ybigta" && chmod 700 "$HOME/ybigta"'
          scp -i "$HOME/.ssh/ec2_key" "$RUNNER_TEMP/app.env" \
            "$EC2_USERNAME@$EC2_HOST:ybigta/.env"

      - name: Pull image and restart container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          IMAGE_REF: ${{ secrets.DOCKERHUB_REPOSITORY }}:latest
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ec2_key" "$EC2_USERNAME@$EC2_HOST" \
            "bash -s -- '$IMAGE_REF'" <<'REMOTE'
          set -euo pipefail

          image_ref="$1"
          app_dir="$HOME/ybigta"
          container_name="ybigta-app"

          chmod 600 "$app_dir/.env"
          sudo docker pull "$image_ref"
          sudo docker rm -f "$container_name" 2>/dev/null || true
          sudo docker run -d \
            --name "$container_name" \
            --restart unless-stopped \
            --env-file "$app_dir/.env" \
            -p 8000:8000 \
            "$image_ref"

          sleep 10
          if ! sudo docker exec "$container_name" python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"; then
            sudo docker logs "$container_name"
            exit 1
          fi

          sudo docker image prune -f
          REMOTE
