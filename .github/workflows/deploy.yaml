name: Test, Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Test Python services
        run: |
          python -m pip install -r mcp_server/requirements-dev.txt -r collector/requirements.txt
          pytest mcp_server/tests collector/tests
          ruff check mcp_server collector
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check Next.js
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.AGENT_DOCKERHUB_USERNAME }}
          password: ${{ secrets.AGENT_DOCKERHUB_TOKEN }}
      - name: Build and push MCP server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.AGENT_DOCKERHUB_REPOSITORY }}:mcp-${{ github.sha }}
            ${{ secrets.AGENT_DOCKERHUB_REPOSITORY }}:mcp-latest
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
      - name: Build and push Collector
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./collector/Dockerfile
          push: true
          tags: |
            ${{ secrets.AGENT_DOCKERHUB_REPOSITORY }}:collector-${{ github.sha }}
            ${{ secrets.AGENT_DOCKERHUB_REPOSITORY }}:collector-latest
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate deployment secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.AGENT_DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.AGENT_DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ secrets.AGENT_DOCKERHUB_REPOSITORY }}
          EC2_HOST: ${{ secrets.AGENT_EC2_HOST }}
          EC2_USERNAME: ${{ secrets.AGENT_EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.AGENT_EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.AGENT_EC2_KNOWN_HOSTS }}
          DB_HOST: ${{ secrets.AGENT_DB_HOST }}
          DB_PORT: ${{ secrets.AGENT_DB_PORT }}
          DB_NAME: ${{ secrets.AGENT_DB_NAME }}
          MCP_DB_USER: ${{ secrets.AGENT_MCP_DB_USER }}
          MCP_DB_PASSWORD: ${{ secrets.AGENT_MCP_DB_PASSWORD }}
          COLLECTOR_DB_USER: ${{ secrets.AGENT_COLLECTOR_DB_USER }}
          COLLECTOR_DB_PASSWORD: ${{ secrets.AGENT_COLLECTOR_DB_PASSWORD }}
          MCP_AUTH_TOKEN: ${{ secrets.AGENT_MCP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          required=(DOCKERHUB_USERNAME DOCKERHUB_TOKEN DOCKERHUB_REPOSITORY EC2_HOST EC2_USERNAME EC2_SSH_KEY EC2_KNOWN_HOSTS DB_HOST DB_PORT DB_NAME MCP_DB_USER MCP_DB_PASSWORD COLLECTOR_DB_USER COLLECTOR_DB_PASSWORD MCP_AUTH_TOKEN)
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "Missing GitHub Secret: AGENT_$name" >&2; exit 1; }
          done
      - name: Configure SSH and runtime files
        env:
          EC2_HOST: ${{ secrets.AGENT_EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.AGENT_EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.AGENT_EC2_KNOWN_HOSTS }}
          DB_HOST: ${{ secrets.AGENT_DB_HOST }}
          DB_PORT: ${{ secrets.AGENT_DB_PORT }}
          DB_NAME: ${{ secrets.AGENT_DB_NAME }}
          MCP_DB_USER: ${{ secrets.AGENT_MCP_DB_USER }}
          MCP_DB_PASSWORD: ${{ secrets.AGENT_MCP_DB_PASSWORD }}
          COLLECTOR_DB_USER: ${{ secrets.AGENT_COLLECTOR_DB_USER }}
          COLLECTOR_DB_PASSWORD: ${{ secrets.AGENT_COLLECTOR_DB_PASSWORD }}
          MCP_AUTH_TOKEN: ${{ secrets.AGENT_MCP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          umask 077
          printf 'DB_HOST=%s\nDB_PORT=%s\nDB_NAME=%s\nMCP_DB_USER=%s\nMCP_DB_PASSWORD=%s\nMCP_AUTH_TOKEN=%s\nMCP_HOST=0.0.0.0\nMCP_PORT=8000\n' "$DB_HOST" "$DB_PORT" "$DB_NAME" "$MCP_DB_USER" "$MCP_DB_PASSWORD" "$MCP_AUTH_TOKEN" > "$RUNNER_TEMP/mcp.env"
          printf 'DB_HOST=%s\nDB_PORT=%s\nDB_NAME=%s\nCOLLECTOR_DB_USER=%s\nCOLLECTOR_DB_PASSWORD=%s\n' "$DB_HOST" "$DB_PORT" "$DB_NAME" "$COLLECTOR_DB_USER" "$COLLECTOR_DB_PASSWORD" > "$RUNNER_TEMP/collector.env"
      - name: Copy deployment files
        env:
          EC2_HOST: ${{ secrets.AGENT_EC2_HOST }}
          EC2_USERNAME: ${{ secrets.AGENT_EC2_USERNAME }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ec2_key" "$EC2_USERNAME@$EC2_HOST" 'install -m 700 -d "$HOME/ybigta"'
          scp -i "$HOME/.ssh/ec2_key" "$RUNNER_TEMP/mcp.env" "$EC2_USERNAME@$EC2_HOST:ybigta/.env"
          scp -i "$HOME/.ssh/ec2_key" "$RUNNER_TEMP/collector.env" "$EC2_USERNAME@$EC2_HOST:ybigta/collector.env"
          scp -i "$HOME/.ssh/ec2_key" infra/nginx/mcp.conf infra/cron/collector.cron infra/scripts/run-collector.sh "$EC2_USERNAME@$EC2_HOST:ybigta/"
      - name: Deploy immutable images
        env:
          EC2_HOST: ${{ secrets.AGENT_EC2_HOST }}
          EC2_USERNAME: ${{ secrets.AGENT_EC2_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.AGENT_DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.AGENT_DOCKERHUB_TOKEN }}
          MCP_IMAGE: ${{ secrets.AGENT_DOCKERHUB_REPOSITORY }}:mcp-${{ github.sha }}
          COLLECTOR_IMAGE: ${{ secrets.AGENT_DOCKERHUB_REPOSITORY }}:collector-${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | ssh -i "$HOME/.ssh/ec2_key" "$EC2_USERNAME@$EC2_HOST" "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"
          ssh -i "$HOME/.ssh/ec2_key" "$EC2_USERNAME@$EC2_HOST" "bash -s -- '$MCP_IMAGE' '$COLLECTOR_IMAGE'" <<'REMOTE'
          set -euo pipefail
          mcp_image="$1"
          collector_image="$2"
          app_dir="$HOME/ybigta"
          container="ybigta-mcp"
          previous_image="$(docker inspect --format '{{.Config.Image}}' "$container" 2>/dev/null || true)"

          chmod 600 "$app_dir/.env" "$app_dir/collector.env"
          chmod 700 "$app_dir/run-collector.sh"
          docker pull "$mcp_image"
          docker pull "$collector_image"
          docker rm -f "$container" 2>/dev/null || true
          docker run -d --name "$container" --restart unless-stopped \
            --env-file "$app_dir/.env" -p 127.0.0.1:8000:8000 "$mcp_image"

          if ! timeout 40 bash -c 'until curl -fsS http://127.0.0.1:8000/health; do sleep 2; done'; then
            docker logs "$container" || true
            docker rm -f "$container" || true
            if [[ -n "$previous_image" ]]; then
              docker run -d --name "$container" --restart unless-stopped \
                --env-file "$app_dir/.env" -p 127.0.0.1:8000:8000 "$previous_image"
            fi
            exit 1
          fi

          printf '%s\n' "$collector_image" > "$app_dir/collector-image"
          { crontab -l 2>/dev/null | grep -v 'ybigta-collector.lock' || true; sed "s|__APP_HOME__|$app_dir|g" "$app_dir/collector.cron"; } | crontab -
          sudo install -m 644 "$app_dir/mcp.conf" /etc/nginx/conf.d/mcp.conf
          sudo nginx -t
          sudo systemctl reload nginx
          docker image prune -f
          REMOTE
