# /etc/nginx/conf.d/mcp.conf
#
# MCP Server 리버스 프록시
#   Internet :80  ->  Nginx  ->  127.0.0.1:8000 (MCP, Docker 컨테이너)
#
# 8000번 포트는 Security Group에 열려 있지 않고, 컨테이너도 127.0.0.1 에만
# 바인딩되어 있으므로 인터넷에서 직접 접근할 수 없다.
#
# 이 파일은 infra/ec2/bootstrap.sh 가 부팅 시 자동으로 배치하는 것과 동일하다.
# 수정 후 반영: sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=mcp_rl:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    location / {
        limit_req zone=mcp_rl burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Authorization: Bearer <MCP_AUTH_TOKEN> 는 MCP 애플리케이션이 검증한다.
        # Nginx는 헤더를 그대로 전달만 한다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP Streamable HTTP / SSE 대응
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
